name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed apps
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.apps.outputs.matrix }}
      count: ${{ steps.apps.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Detect apps from the PR diff
        id: apps
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            node scripts/changed-apps.mjs
          else
            node scripts/changed-apps.mjs "$BASE_SHA" "$HEAD_SHA"
          fi
      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/*.test.mjs
      - run: pnpm format
      - run: pnpm lint

  quality:
    name: Quality (${{ matrix.app }})
    needs: changes
    if: needs.changes.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir "${{ matrix.app }}" typecheck
      - run: pnpm --dir "${{ matrix.app }}" format
      - run: pnpm --dir "${{ matrix.app }}" lint
      - run: pnpm --dir "${{ matrix.app }}" build
      - run: pnpm --dir "${{ matrix.app }}" test

  required:
    name: CI required
    if: always()
    needs: [changes, quality]
    runs-on: ubuntu-latest
    steps:
      - name: Check every required result (including no app changes)
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          APP_COUNT: ${{ needs.changes.outputs.count }}
        run: |
          test "$CHANGES_RESULT" = "success"
          if [ "$APP_COUNT" = "0" ]; then
            test "$QUALITY_RESULT" = "skipped"
          else
            test "$QUALITY_RESULT" = "success"
          fi
